name: AI Instagram Daily Pipeline

on:
  schedule:
    # Runs every day at 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      live_mode:
        description: 'Run in LIVE mode (posts to Instagram)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Step 1: Checkout code ──────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ──────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Step 3: Install dependencies ──────────────────────────
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Install system fonts for PIL ──────────────────
      - name: Install System Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fontconfig
          fc-cache -fv

      # ── Step 5: Create .env from GitHub Secrets ────────────────
      - name: Create .env file from Secrets
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_NAME=${{ secrets.IG_ACCOUNT_NAME }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          DASHBOARD_SECRET_KEY=${{ secrets.DASHBOARD_SECRET_KEY }}
          DASHBOARD_PORT=${{ secrets.DASHBOARD_PORT }}
          POST_DELAY_SECONDS=${{ secrets.POST_DELAY_SECONDS }}
          LIVE_MODE=${{ github.event.inputs.live_mode || secrets.LIVE_MODE }}
          EOF

      # ── Step 6: Run the Pipeline ──────────────────────────────
      - name: Run AI Instagram Pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          LIVE="${{ github.event.inputs.live_mode || secrets.LIVE_MODE }}"
          if [ "$LIVE" = "true" ]; then
            echo "Running in LIVE mode - will post to Instagram"
            python main_pipeline.py --live
          else
            echo "Running in DRY RUN mode - will NOT post to Instagram"
            python main_pipeline.py
          fi

      # ── Step 7: Upload generated carousel images as artifacts ──
      - name: Upload Carousel Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-images-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
